# Local development and tests only. Production uses a managed Postgres (docs/PRODUCTION_PLAN.md).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: slacky
      POSTGRES_DB: slacky
      # No password in the repo: the port is bound to localhost only and trusts local clients.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slacky -d slacky"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
